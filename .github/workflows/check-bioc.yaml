## Runs R CMD check and BiocCheck on the three platforms Bioconductor builds
## on, against Bioconductor devel.
##
## The container job is the authoritative Linux run: it uses the same
## bioconductor/bioconductor_docker:devel image the Bioconductor build system
## uses, so a pass here means a pass on the Linux builder. The macOS and
## Windows jobs install Bioconductor devel through BiocManager, because no
## official image exists for them.

name: check-bioc

on:
  push:
    branches: [main, master, devel]
  pull_request:
    branches: [main, master, devel]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Never let a check stall waiting for a prompt.
  R_KEEP_PKG_SOURCE: yes
  _R_CHECK_FORCE_SUGGESTS_: false

jobs:
  linux:
    name: linux / bioc-devel (container)
    runs-on: ubuntu-latest
    container:
      image: bioconductor/bioconductor_docker:devel

    steps:
      - uses: actions/checkout@v4

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/R/site-library
          key: ${{ runner.os }}-bioc-devel-${{ hashFiles('DESCRIPTION') }}
          restore-keys: ${{ runner.os }}-bioc-devel-

      # The PDF vignette needs a LaTeX engine. The Bioconductor devel image
      # does not ship one -- it reports "pdflatex not found! Not building
      # PDF manual" -- so install TinyTeX here too.
      - uses: r-lib/actions/setup-tinytex@v2

      - name: Install dependencies
        run: |
          # The devel image does not ship remotes, and the next lines need it.
          if (!requireNamespace("remotes", quietly = TRUE)) {
              install.packages("remotes")
          }
          BiocManager::install(ask = FALSE, update = TRUE)
          remotes::install_deps(dependencies = TRUE, upgrade = "always")
          BiocManager::install(c("BiocCheck", "rcmdcheck"),
                               ask = FALSE, update = FALSE)
        shell: Rscript {0}

      - name: Session info
        run: |
          cat("BiocManager::version(): ",
              as.character(BiocManager::version()), "\n")
          print(sessionInfo())
        shell: Rscript {0}

      - name: R CMD check
        run: |
          rcmdcheck::rcmdcheck(
              args = c("--no-manual", "--timings"),
              error_on = "warning",
              check_dir = "check"
          )
        shell: Rscript {0}

      - name: BiocCheck
        run: |
          BiocCheck::BiocCheck(
              ".",
              `quit-with-status` = TRUE,
              `no-check-bioc-help` = TRUE
          )
        shell: Rscript {0}

      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-check-results
          path: check

  other-platforms:
    name: ${{ matrix.os }} / bioc-devel
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          # Bioconductor devel tracks R devel; use-public-rspm speeds up
          # binary installs considerably on macOS and Windows.
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      # The PDF vignette needs a LaTeX engine; no runner here ships one.
      - uses: r-lib/actions/setup-tinytex@v2

      - name: Point at Bioconductor devel
        run: |
          install.packages("BiocManager")
          BiocManager::install(version = "devel", ask = FALSE, update = FALSE)
        shell: Rscript {0}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            bioc::BiocCheck
          needs: check

      - name: Session info
        run: |
          cat("BiocManager::version(): ",
              as.character(BiocManager::version()), "\n")
          print(sessionInfo())
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--timings")'
          error-on: '"warning"'
          upload-snapshots: true

      - name: BiocCheck
        run: |
          BiocCheck::BiocCheck(
              ".",
              `quit-with-status` = TRUE,
              `no-check-bioc-help` = TRUE
          )
        shell: Rscript {0}
